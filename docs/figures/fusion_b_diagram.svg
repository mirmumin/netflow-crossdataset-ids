<text x="615" y="522" class="i" font-size="18" text-anchor="middle">cross-fitted reference</text>
<rect x="830" y="118.0" width="300" height="44" rx="22.0" fill="#fdf2bd" stroke="#d9ad00" stroke-width="3" filter="url(#sh)"/>
