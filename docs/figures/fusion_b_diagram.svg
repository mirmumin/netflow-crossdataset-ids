<rect x="1800" y="408.0" width="240" height="44" rx="22.0" fill="#d3e5f8" stroke="#4a8fd6" stroke-width="3" filter="url(#sh)"/>
<text x="1920.0" y="437.56" class="b" font-size="21" text-anchor="middle">THRESHOLD τ</text>
<text x="1920" y="485" class="i" font-size="18" text-anchor="middle">95th percentile of the</text>
<text x="1920" y="507" class="i" font-size="18" text-anchor="middle">cross-fitted benign scores</text>
<path d="M1920,322 L1920,400" fill="none" stroke="#2b2d42" stroke-width="3" marker-end="url(#ah)"/>
<rect x="1790" y="578.0" width="125" height="44" rx="22.0" fill="#fad0d0" stroke="#e05a5a" stroke-width="3" filter="url(#sh)"/>
<text x="1852.5" y="606.84" class="b" font-size="19" text-anchor="middle">ATTACK</text>
<rect x="1925" y="578.0" width="125" height="44" rx="22.0" fill="#d2f0e0" stroke="#3aa66a" stroke-width="3" filter="url(#sh)"/>
<text x="1987.5" y="606.84" class="b" font-size="19" text-anchor="middle">BENIGN</text>
<path d="M1920,520 L1920,545 L1852,545 L1852,570" fill="none" stroke="#2b2d42" stroke-width="3" marker-end="url(#ah)"/>
<path d="M1920,545 L1987,545 L1987,570" fill="none" stroke="#2b2d42" stroke-width="3" marker-end="url(#ah)"/>
<text x="1852" y="650" class="i" font-size="17" text-anchor="middle">p ≥ τ</text>
<text x="1987" y="650" class="i" font-size="17" text-anchor="middle">p &lt; τ</text>
<rect x="30" y="680" width="640" height="150" rx="26" fill="none" stroke="#222" stroke-width="3" stroke-dasharray="10,8" stroke-linecap="round"/>
<text x="350" y="720" class="b" font-size="21" text-anchor="middle">FUSION-B-v2 (VARIANT)</text>
<text x="350" y="754" class="i" font-size="18" text-anchor="middle">the features of every network are first mapped to the quantiles</text>
<text x="350" y="778" class="i" font-size="18" text-anchor="middle">of its own benign traffic (in the target: the k benign flows),</text>
<text x="350" y="802" class="i" font-size="18" text-anchor="middle">then XGBoost and TabPFN are applied to the aligned features</text>
<text x="1030.0" y="955" font-size="24" text-anchor="middle" class="r"><tspan class="b">Figure 2.</tspan> The proposed Fusion-B for benign-only cross-network intrusion detection.</text>
