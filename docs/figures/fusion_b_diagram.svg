<text x="220" y="285" class="i" font-size="18" text-anchor="middle">R is never used to train XGBoost</text>
<rect x="30" y="345" width="380" height="205" rx="26" fill="none" stroke="#222" stroke-width="3" stroke-dasharray="2,7" stroke-linecap="round"/>
<text x="220.0" y="383" class="b" font-size="23" text-anchor="middle">TARGET NETWORK</text>
<text x="220.0" y="409" class="i" font-size="18" text-anchor="middle">new deployment, benign labels only</text>
<rect x="55" y="428.0" width="330" height="44" rx="22.0" fill="#d2f0e0" stroke="#3aa66a" stroke-width="3" filter="url(#sh)"/>
