<text x="980" y="190" class="i" font-size="18" text-anchor="middle">what attacks look like elsewhere</text>
<rect x="830" y="428.0" width="300" height="44" rx="22.0" fill="#fbd6e8" stroke="#d9559a" stroke-width="3" filter="url(#sh)"/>
<text x="980.0" y="457.56" class="b" font-size="21" text-anchor="middle">ANOMALY RANK a(x)</text>
<text x="980" y="500" class="i" font-size="18" text-anchor="middle">what is unusual in this network</text>
