<text x="1700" y="311" class="s" font-size="30" text-anchor="middle" fill="#5b4bc4">AI</text>
<text x="1700" y="407.0" class="i" font-size="17" text-anchor="middle">pretrained, no training</text>
<text x="1700" y="429.0" class="i" font-size="17" text-anchor="middle">on the target network</text>
<path d="M1530,295 L1625,295" fill="none" stroke="#2b2d42" stroke-width="3" marker-end="url(#ah)"/>
<text x="1578" y="280" class="i" font-size="17" text-anchor="middle">test</text>
