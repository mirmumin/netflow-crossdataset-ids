<line x1="1740.0" y1="231.0" x2="1740.0" y2="369.0" stroke="#2b2d42" stroke-width="5"/>
<line x1="1631.0" y1="340.0" x2="1769.0" y2="340.0" stroke="#2b2d42" stroke-width="5"/>
<rect x="1645.0" y="245.0" width="110" height="110" rx="10" fill="#5b4bc4" stroke="#2b2d42" stroke-width="4"/>
