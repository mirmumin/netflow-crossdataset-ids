<text x="1365.0" y="678" class="b" font-size="23" text-anchor="middle">CONTEXT SET</text>
<text x="1365.0" y="704" class="i" font-size="18" text-anchor="middle">m = k source attacks (100 / 1000)</text>
<rect x="1225" y="723.0" width="280" height="44" rx="22.0" fill="#d2f0e0" stroke="#3aa66a" stroke-width="3" filter="url(#sh)"/>
<text x="1365.0" y="752.56" class="b" font-size="21" text-anchor="middle">k BENIGN → LABEL 0</text>
<rect x="1225" y="788.0" width="280" height="44" rx="22.0" fill="#fad0d0" stroke="#e05a5a" stroke-width="3" filter="url(#sh)"/>
<text x="1365.0" y="817.56" class="b" font-size="21" text-anchor="middle">R ATTACKS → LABEL 1</text>
