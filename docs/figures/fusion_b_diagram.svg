<rect x="1225" y="273.0" width="280" height="44" rx="22.0" fill="#cdeff3" stroke="#2fb3c4" stroke-width="3" filter="url(#sh)"/>
<text x="1365.0" y="301.84" class="b" font-size="19" text-anchor="middle">x : 47 NETFLOW FEATURES</text>
<rect x="1225" y="428.0" width="280" height="44" rx="22.0" fill="#fbd6e8" stroke="#d9559a" stroke-width="3" filter="url(#sh)"/>
<text x="1365.0" y="457.56" class="b" font-size="21" text-anchor="middle">a(x)</text>
