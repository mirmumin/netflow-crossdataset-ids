# Global experiment configuration. Every script reads this file.
seed: 42
seeds: [42, 43, 44, 45, 46]        # repeated runs for mean +/- SD

paths:
  raw_dir: data/raw
  processed_dir: data/processed
  results_dir: results

# The four NetFlow v3 datasets (UQ). `file` is a glob pattern relative to
# raw_dir, so you can copy the unzipped folders into data/raw/ as they are.
# The pattern must match exactly one CSV.
datasets:
  unsw:    {name: NF-UNSW-NB15-v3,        file: "NF-UNSW-NB15-v3*/**/*.csv"}
  toniot:  {name: NF-ToN-IoT-v3,          file: "NF-ToN-IoT-v3*/**/*.csv"}
  botiot:  {name: NF-BoT-IoT-v3,          file: "NF-BoT-IoT-v3*/**/*.csv"}
  cic2018: {name: NF-CSE-CIC-IDS2018-v3,  file: "NF-CICIDS2018-v3*/**/*.csv"}

subsample:
  n_rows: 500000            # target rows per dataset after subsampling
  min_per_class: 2000       # keep all rows of attack classes smaller than this
  min_benign: 100000        # keep at least this many benign flows (BoT-IoT is 99.7% attack)
  chunksize: 1000000        # CSV rows read at a time (keeps RAM low on Colab)

split:
  test_size: 0.2            # within-dataset hold-out, stratified on Attack

baselines:
  models: [RF, XGB, LR, SVM, KNN]
  ensemble: [RF, XGB, LR, SVM, KNN]   # soft-voting members ("ENS" in results)
  feature_sets: [v2, v3]
  max_train:                # stratified cap on source training rows per model
    RF: 200000
    XGB: 400000
    LR: 400000
    SVM: 20000              # RBF-SVM is O(n^2); larger is too slow on Colab
    KNN: 50000
  max_test: 100000          # stratified cap on each test split (speed)

fusion:
  mode: loo                 # loo: XGBoost trained on the other 3 networks; pair: one source network
  budgets: [100, 1000]      # labelled target flows available
  max_source_train: 400000  # rows for the source XGBoost (stratified cap)
  max_test: 20000           # target test rows (TabPFN inference cost)
  learner: tabpfn           # few-shot learner; "rf" is a CPU stand-in for testing only
  tabpfn_version: v2        # v2 weights are not gated; "default" needs TABPFN_TOKEN
